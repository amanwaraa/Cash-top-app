<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>تسجيل الدخول - كاش توب المحاسبي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="manifest.webmanifest" rel="manifest"><link href="app-icon.png" rel="icon"><meta name="theme-color" content="#7b2cbf">
<script src="activation-runtime.js?v=500"></script><script src="turso-config.js?v=500"></script><script src="turso-rtdb.js?v=200"></script>
<style>
:root{--primary:#7b2cbf;--hover:#5a189a;--bg:#f6f4f9;--card:#fff;--text:#2d2a32;--muted:#6c63ff;--border:#d8d0e3;--green:#178344;--red:#c62828}*{box-sizing:border-box}
body{font-family:Cairo,sans-serif;background:radial-gradient(circle at 50% -10%,#eadcff 0,#f6f4f9 44%,#f9fafb 100%);margin:0;min-height:100vh;color:var(--text);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--card);width:min(440px,100%);padding:38px 30px 30px;border-radius:20px;box-shadow:0 18px 55px rgba(123,44,191,.11);text-align:center;border-top:5px solid var(--primary);position:relative;overflow:hidden}.login-card:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(123,44,191,.035);left:-95px;bottom:-100px;pointer-events:none}
.logo-container{display:flex;justify-content:center;margin-bottom:13px}.app-logo{width:82px;height:82px;object-fit:cover;border-radius:21px;box-shadow:0 11px 28px rgba(123,44,191,.20)}h1{margin:0 0 4px;color:var(--primary);font-size:27px;font-weight:800}.subtitle{margin:0 0 28px;color:#777;font-size:13px;font-weight:700}
.file-upload-wrapper{text-align:right}.field-frame{position:relative;padding-top:9px}.field-title{position:absolute;z-index:2;top:0;right:17px;background:#fff;padding:0 8px;color:#443c4a;font-size:12px;font-weight:800}.file-drop-area{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:180px;padding:30px 18px;border:2px dashed var(--border);border-radius:14px;background:#faf9fc;transition:.25s;cursor:pointer}.file-drop-area:hover,.file-drop-area.drag{border-color:var(--primary);background:rgba(123,44,191,.045);box-shadow:0 0 0 4px rgba(123,44,191,.035)}.file-input{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;opacity:0}.upload-icon{font-size:44px;color:var(--muted)}.file-msg{font-size:13px;color:#666;margin-top:14px;text-align:center;font-weight:700;line-height:1.7}.file-hint{font-size:10px;color:#999;margin-top:4px}.file-info{display:none;margin-top:10px;padding:10px;border-radius:9px;background:#f3ecfb;color:var(--primary);font-size:11px;font-weight:800;word-break:break-all}.file-info.show{display:block}
.submit-btn{background:var(--primary);color:#fff;border:0;width:100%;padding:14px;font-size:15px;font-weight:800;border-radius:10px;cursor:pointer;transition:.25s;font-family:Cairo,sans-serif;box-shadow:0 6px 18px rgba(123,44,191,.22);margin-top:20px}.submit-btn:hover{background:var(--hover);box-shadow:0 9px 24px rgba(123,44,191,.28);transform:translateY(-1px)}.submit-btn:disabled{background:#cbb4e3;cursor:not-allowed;box-shadow:none;transform:none}.status{display:none;margin-top:14px;padding:11px;border-radius:9px;font-size:11px;font-weight:800;line-height:1.75;text-align:right}.status.show{display:block}.status.success{background:#e8f5e9;color:#2e7d32;border:1px solid #c8e6c9}.status.error{background:#ffebee;color:#c62828;border:1px solid #ffcdd2}.status.info{background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe}.security{margin-top:14px;display:flex;justify-content:center;align-items:center;gap:6px;color:#16794b;font-size:10px;font-weight:800}.security i{font-size:11px}
@media(max-width:480px){body{padding:14px}.login-card{padding:31px 20px 25px;border-radius:17px}.app-logo{width:74px;height:74px;border-radius:19px}h1{font-size:23px}.file-drop-area{min-height:165px}}
</style></head>
<body><div class="login-card"><div class="logo-container"><img class="app-logo" src="app-icon.png" alt="كاش توب"></div><h1>كاش توب المحاسبي</h1><p class="subtitle">بوابة الدخول الآمنة للنظام</p>
<form id="loginForm"><div class="file-upload-wrapper"><div class="field-frame"><span class="field-title">ملف التفعيل والدخول</span><div class="file-drop-area" id="dropArea"><div id="fileIconContainer"><i id="fileIcon" class="fa-solid fa-file-shield upload-icon"></i></div><span class="file-msg" id="fileMessage">اضغط هنا لاختيار ملف التفعيل أو اسحبه وأفلته</span><span class="file-hint">ملف كاش توب آمن بصيغة .ctauth</span><input class="file-input" type="file" id="activationFile" accept=".ctauth,.ctkey,.cashkey,.key,.dat" required></div></div><div class="file-info" id="fileInfo"></div></div><button type="submit" class="submit-btn" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول</button></form><div id="status" class="status"></div><div class="security"><i class="fa-solid fa-shield-halved"></i><span>الدخول يتم بواسطة ملف تفعيل مشفّر ومخصص للحساب</span></div></div>
<script src="login.js?v=500"></script></body></html>
